<article class="text-left theme-card rounded-1 p-3">
  <div class="d-flex flex-justify-between flex-items-start mb-1">
    <h3 class="f4 lh-condensed mb-1">
      <a href="{{ post.url | relative_url }}">
        {{ post.icon }} {{ post.title }}
      </a>
    </h3>
  </div>

  <time class="text-gray mb-2 ws-normal" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %d, %Y" }}</time>
</article>
